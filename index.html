<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLAIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- apply the saved theme before the page paints (no flash) -->
<script>
try{
  var t = JSON.parse(localStorage.getItem('reclaim_theme') || '{}');
  document.documentElement.dataset.theme = t.theme || 'lavender';
  document.documentElement.dataset.mode = t.mode === 'dark' ? 'dark' : 'light';
}catch(e){}
</script>
</head>
<body>
<div class="brandbar">
  <div class="pill"><i data-lucide="package-search" class="ic" style="width:16px;height:16px"></i> <span>RECLAIM</span></div>
  <button class="theme-btn" id="themeBtn" title="Appearance" aria-label="Appearance"><i data-lucide="palette" class="ic"></i></button>
  <div class="theme-menu" id="themeMenu" hidden></div>
</div>
<div id="app"></div>

<!-- libraries -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<!-- our code (order matters) -->
<script src="config.js"></script>
<script src="accounts.js"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</body>
</html>
